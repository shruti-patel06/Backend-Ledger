<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Backend Ledger</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <form class="card" id="register-form">
      <h1>Backend Ledger</h1>
      <p class="subtitle">Create your account</p>

      <label for="name">Name</label>
      <input type="text" id="name" required autocomplete="name" />

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" />

      <p class="error" id="error"></p>
      <button type="submit">Register</button>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    requireGuest();
    document.getElementById("register-form").addEventListener("submit", handleRegister);
  </script>
</body>
</html>
