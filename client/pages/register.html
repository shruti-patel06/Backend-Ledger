<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Backend Ledger</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <form class="card auth-card" id="register-form" novalidate>
      <h1>Backend Ledger</h1>
      <p class="subtitle">Create your account</p>

      <label for="name">Name</label>
      <input type="text" id="name" required autocomplete="name" />

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
        <button type="button" class="link-btn" data-toggle-password="password">Show</button>
      </div>
      <p class="hint">At least 6 characters.</p>

      <p class="error" id="error" role="alert"></p>
      <button type="submit" class="block" id="submit-btn">Register</button>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireGuest();
    initAuthPage();
    document.getElementById("register-form").addEventListener("submit", handleRegister);
  </script>
</body>
</html>
