<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Backend Ledger</title>
  <script src="../js/theme.js"></script>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="auth-page">
    <form class="card auth-card" id="login-form" novalidate>
      <h1>Backend Ledger</h1>
      <p class="subtitle">Log in to your account</p>

      <p class="notice" id="notice" hidden></p>

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" />

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="button" class="link-btn" data-toggle-password="password">Show</button>
      </div>

      <p class="error" id="error" role="alert"></p>
      <button type="submit" class="block" id="submit-btn">Log in</button>
      <p class="switch">No account? <a href="register.html">Register</a></p>
      <p class="switch"><a href="privacy.html">Privacy Policy</a></p>
    </form>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireGuest();
    initAuthPage();
    document.getElementById("login-form").addEventListener("submit", handleLogin);
  </script>
</body>
</html>
